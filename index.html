<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fast Xtream Viewer</title>
<style>
* { box-sizing: border-box }
html, body {
  height: 100%;
  overflow: hidden;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: #eee;
  display: flex;
  flex-direction: column;
}
header {
  background: #1f1f1f;
  padding: 12px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 10;
  flex-shrink: 0;
}
input, button { padding: 9px; border-radius: 6px; border: none; }
button { background: #2563eb; color: white; cursor: pointer; }
button:hover { background: #1d4ed8; }
#status {
  padding: 10px;
  background: #000;
  color: #bbb;
  font-size: 14px;
  flex-shrink: 0;
}
#layout {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 320px 1fr;
}
#categories {
  overflow-y: auto;
  background: #181818;
  border-right: 1px solid #333;
  padding: 10px;
}
#channels {
  overflow-y: auto;
  padding: 10px;
}
.category { padding: 10px; background: #262626; margin-bottom: 6px; border-radius: 6px; cursor: pointer }
.category:hover { background: #333 }
.category.active { background: #2563eb }
.channel { padding: 9px; background: #1d1d1d; border-bottom: 1px solid #333; font-size: 14px }
.channel-row { display: flex; justify-content: space-between; gap: 10px; align-items: center }
.channel-actions { display: flex; gap: 6px; flex-wrap: wrap }
.small { font-size: 12px; color: #aaa; word-break: break-all }
.section-title { width: 100%; color: #aaa; font-size: 13px; margin-top: 8px }
.notice { color: #aaa; padding: 12px }
.series-card { padding: 12px; background: #1d1d1d; border-bottom: 1px solid #333; cursor: pointer }
.series-card:hover { background: #292929 }
.series-logo { width: 55px; height: 75px; object-fit: cover; margin-right: 12px; border-radius: 4px; background: #333 }
.back { margin-bottom: 12px }
</style>
</head>
<body>
<header>
<div class="section-title">Xtream Login</div>
<input id="server" placeholder="Server URL e.g. http://example.com:8080" size="35">
<input id="username" placeholder="Username">
<input id="password" placeholder="Password" type="password">
<button onclick="loadXtream()">Load Xtream</button>

<div class="section-title">Content</div>
<button id="liveBtn" class="section active" onclick="switchSection('live')">📺 Live TV</button>
<button id="vodBtn" class="section" onclick="switchSection('vod')">🎬 Movies / VOD</button>
<button id="seriesBtn" class="section" onclick="switchSection('series')">📺 Series</button>

<div class="section-title">Search</div>
<input id="search" placeholder="Search..." oninput="searchContent()" size="45">
<button onclick="clearSearch()">Clear</button>
</header>

<div id="status">Enter Xtream details and click Load Xtream.</div>
<div id="layout">
<div id="categories"></div>
<div id="channels" class="notice">Select a content type and load Xtream.</div>
</div>

<script>
const data={
 live:{loaded:false,categories:[],groups:[],items:[]},
 vod:{loaded:false,categories:[],groups:[],items:[]},
 series:{loaded:false,categories:[],groups:[],items:[]}
};

let currentSection="live";
let activeCategory=null;
let currentSeries=null;
let currentViewItems=[];
let renderedCount=0;
let loading=false;
const RENDER_BATCH=150;

function cleanServer(url){return url.trim().replace(/\/$/,"")}

function getXtreamDetails(){
 return {
  server:cleanServer(document.getElementById("server").value),
  username:document.getElementById("username").value.trim(),
  password:document.getElementById("password").value.trim()
 };
}

async function xtream(action,extra={}){
 const d=getXtreamDetails();
 if(!d.server||!d.username||!d.password)throw new Error("Missing Xtream details");

 const params=new URLSearchParams({host:d.server,user:d.username,pass:d.password,action,...extra});
 const res=await fetch(`/api/xtream?${params.toString()}`);
 const text=await res.text();

 if(!res.ok)throw new Error(text||"Xtream request failed");
 try{return JSON.parse(text)}
 catch{throw new Error("Xtream did not return JSON: "+text.slice(0,200))}
}

/* Only categories are loaded at login. The large content lists are lazy-loaded. */
async function loadXtream(){
 ["live","vod","series"].forEach(type=>{
  data[type]={loaded:false,categories:[],groups:[],items:[]};
 });
 activeCategory=null;
 currentSeries=null;
 document.getElementById("categories").innerHTML="";
 document.getElementById("channels").innerHTML='<div class="notice">Loading categories...</div>';
 document.getElementById("status").textContent="Loading Xtream categories...";

 try{
  const [liveCats,vodCats,seriesCats]=await Promise.all([
   xtream("get_live_categories"),
   xtream("get_vod_categories"),
   xtream("get_series_categories")
  ]);

  data.live.categories=liveCats||[];
  data.vod.categories=vodCats||[];
  data.series.categories=seriesCats||[];

  switchSection("live");
  document.getElementById("status").textContent="Ready. Select Live TV, Movies / VOD or Series.";
 }catch(err){
  console.error(err);
  document.getElementById("status").textContent="Error loading Xtream: "+(err.message||err);
 }
}

async function ensureSectionLoaded(type){
 if(data[type].loaded)return true;
 if(loading)return false;

 loading=true;
 const label=type==="live"?"Live TV":type==="vod"?"Movies / VOD":"Series";
 document.getElementById("status").textContent=`Loading ${label}...`;

 try{
  let items;
  if(type==="live")items=await xtream("get_live_streams");
  else if(type==="vod")items=await xtream("get_vod_streams");
  else items=await xtream("get_series");

  data[type].items=items||[];
  data[type].groups=groupItems(data[type].categories,data[type].items);
  data[type].loaded=true;
  loading=false;

  document.getElementById("status").textContent=
   `Loaded ${data[type].items.length.toLocaleString()} ${label} items in ${data[type].groups.length.toLocaleString()} categories.`;
  renderCategories();
  return true;
 }catch(err){
  loading=false;
  document.getElementById("status").textContent="Error loading "+label+": "+(err.message||err);
  return false;
 }
}

function groupItems(categories,items){
 const map={};
 (categories||[]).forEach(cat=>map[String(cat.category_id)]=cat.category_name||"Uncategorised");

 const groups={};
 (items||[]).forEach(item=>{
  const name=map[String(item.category_id)]||"Uncategorised";
  if(!groups[name])groups[name]=[];
  groups[name].push({
   ...item,
   name:item.name||"Unnamed",
   streamId:item.stream_id||item.series_id||"",
   extension:item.container_extension||"mp4",
   logo:item.stream_icon||item.cover||""
  });
 });

 return Object.keys(groups).sort().map(name=>({name,channels:groups[name]}));
}

async function switchSection(section){
 currentSection=section;
 activeCategory=null;
 currentSeries=null;
 currentViewItems=[];
 document.getElementById("search").value="";

 document.querySelectorAll(".section").forEach(b=>b.classList.remove("active"));
 document.getElementById(section+"Btn").classList.add("active");

 renderCategories();
 const ok=await ensureSectionLoaded(section);
 if(!ok)return;

 renderCategories();
 const label=section==="live"?"Live TV":section==="vod"?"Movies / VOD":"Series";
 document.getElementById("channels").innerHTML=
  `<div class="notice">Select a ${escapeHtml(label)} category.</div>`;
}

function renderCategories(){
 const div=document.getElementById("categories");
 div.innerHTML="";
 const groups=data[currentSection].groups;

 if(!groups.length){
  div.innerHTML='<div class="notice">No categories loaded.</div>';
  return;
 }

 groups.forEach((group,index)=>{
  const el=document.createElement("div");
  el.className="category";
  el.textContent=`${group.name} (${group.channels.length.toLocaleString()})`;
  el.onclick=()=>{
   activeCategory=index;
   document.getElementById("search").value="";
   renderCategories();
   showItems(group.channels,group.name,currentSection==="series");
  };
  if(activeCategory===index)el.classList.add("active");
  div.appendChild(el);
 });
}

/* Batched rendering prevents 50,000 DOM elements being created at once. */
function showItems(items,title,isSeries){
 currentViewItems=items||[];
 renderedCount=0;

 const box=document.getElementById("channels");
 box.innerHTML="";
 const h=document.createElement("h2");
 h.textContent=`${title} (${currentViewItems.length.toLocaleString()})`;
 box.appendChild(h);

 const list=document.createElement("div");
 list.id="resultList";
 box.appendChild(list);

 appendBatch(isSeries);

 box.onscroll=()=>{
  if(box.scrollTop+box.clientHeight>=box.scrollHeight-500)appendBatch(isSeries);
 };
}

function appendBatch(isSeries){
 const list=document.getElementById("resultList");
 if(!list||renderedCount>=currentViewItems.length)return;

 const end=Math.min(renderedCount+RENDER_BATCH,currentViewItems.length);
 const frag=document.createDocumentFragment();

 for(let i=renderedCount;i<end;i++){
  frag.appendChild(isSeries?createSeriesCard(currentViewItems[i]):createChannelRow(currentViewItems[i]));
 }
 list.appendChild(frag);
 renderedCount=end;
 updateRenderStatus();
}

function updateRenderStatus(){
 let s=document.getElementById("renderStatus");
 if(!s){
  s=document.createElement("div");
  s.id="renderStatus";
  s.className="notice";
  document.getElementById("channels").appendChild(s);
 }
 s.textContent=`Showing ${renderedCount.toLocaleString()} of ${currentViewItems.length.toLocaleString()}`;
}

function createChannelRow(ch){
 const row=document.createElement("div");
 row.className="channel";
 const url=getStreamUrl(ch);

 row.innerHTML=`
 <div class="channel-row">
  <div style="flex:1"><strong>${escapeHtml(ch.name)}</strong>
   <div class="small">${ch.streamId?"ID: "+escapeHtml(ch.streamId):""}${ch.extension?"<br>Format: ."+escapeHtml(ch.extension):""}</div>
  </div>
  <div class="channel-actions">
   <button class="copyBtn">Copy URL</button>
   <button class="m3uBtn">Download .M3U</button>
  </div>
 </div>`;

 row.querySelector(".copyBtn").onclick=()=>copyStream(url);
 row.querySelector(".m3uBtn").onclick=()=>downloadM3U(url,ch.name);
 return row;
}

function createSeriesCard(item){
 const row=document.createElement("div");
 row.className="series-card";
 const cover=item.cover||item.logo||"";

 row.innerHTML=`
 <div style="display:flex;align-items:center">
  ${cover?`<img class="series-logo" src="${escapeHtml(cover)}" onerror="this.style.display='none'">`:""}
  <div><strong>${escapeHtml(item.name)}</strong>
   <div class="small">Series ID: ${escapeHtml(item.series_id||item.streamId)}</div>
  </div>
 </div>`;

 row.onclick=()=>openSeries(item);
 return row;
}

async function openSeries(series){
 currentSeries=series;
 const box=document.getElementById("channels");
 box.innerHTML=`<div class="notice">Loading ${escapeHtml(series.name)}...</div>`;

 try{
  const result=await xtream("get_series_info",{series_id:series.series_id||series.streamId});
  renderEpisodes(series,result);
 }catch(err){
  box.innerHTML=`<div class="notice">Error loading series: ${escapeHtml(err.message)}</div>`;
 }
}

function renderEpisodes(series,result){
 const box=document.getElementById("channels");
 box.innerHTML="";

 const back=document.createElement("button");
 back.className="back";
 back.textContent="← Back to Series";
 back.onclick=()=>{
  if(activeCategory!==null){
   const g=data.series.groups[activeCategory];
   showItems(g.channels,g.name,true);
  }
 };
 box.appendChild(back);

 const h=document.createElement("h2");
 h.textContent=series.name;
 box.appendChild(h);

 const episodes=result.episodes||{};
 let found=false;

 Object.keys(episodes).sort((a,b)=>Number(a)-Number(b)).forEach(season=>{
  const sh=document.createElement("h3");
  sh.textContent=`Season ${season}`;
  box.appendChild(sh);

  (episodes[season]||[]).forEach(ep=>{
   found=true;
   const row=document.createElement("div");
   row.className="channel";
   const url=getSeriesUrl(ep.id||"",ep.container_extension||"mp4");

   row.innerHTML=`
   <div class="channel-row">
    <div style="flex:1"><strong>S${String(season).padStart(2,"0")} E${String(ep.episode_num||"").padStart(2,"0")} - ${escapeHtml(ep.title||"Episode")}</strong>
     <div class="small">${ep.info?.plot?escapeHtml(ep.info.plot)+"<br>":""}Format: .${escapeHtml(ep.container_extension||"mp4")}</div>
    </div>
    <div class="channel-actions"><button class="copyBtn">Copy URL</button><button class="m3uBtn">Download .M3U</button></div>
   </div>`;

   row.querySelector(".copyBtn").onclick=()=>copyStream(url);
   row.querySelector(".m3uBtn").onclick=()=>downloadM3U(url,`${series.name} - S${season}E${ep.episode_num}`);
   box.appendChild(row);
  });
 });

 if(!found)box.insertAdjacentHTML("beforeend",'<div class="notice">No episodes found.</div>');
}

function getStreamUrl(ch){
 const d=getXtreamDetails();
 if(!ch.streamId)return "";
 const ext=ch.extension||"mp4";

 if(currentSection==="live")
  return `${d.server}/live/${encodeURIComponent(d.username)}/${encodeURIComponent(d.password)}/${ch.streamId}.${ext}`;
 if(currentSection==="vod")
  return `${d.server}/movie/${encodeURIComponent(d.username)}/${encodeURIComponent(d.password)}/${ch.streamId}.${ext}`;
 return "";
}

function getSeriesUrl(id,ext){
 const d=getXtreamDetails();
 if(!id)return "";
 return `${d.server}/series/${encodeURIComponent(d.username)}/${encodeURIComponent(d.password)}/${id}.${ext||"mp4"}`;
}

function searchContent(){
 const q=document.getElementById("search").value.toLowerCase().trim();

 if(!q){
  if(activeCategory!==null){
   const g=data[currentSection].groups[activeCategory];
   showItems(g.channels,g.name,currentSection==="series");
  }else document.getElementById("channels").innerHTML='<div class="notice">Select a category or search.</div>';
  return;
 }

 if(!data[currentSection].loaded){
  document.getElementById("channels").innerHTML='<div class="notice">Load this content type first.</div>';
  return;
 }

 activeCategory=null;
 renderCategories();

 const matches=[];
 data[currentSection].groups.forEach(group=>{
  group.channels.forEach(item=>{
   if(String(item.name).toLowerCase().includes(q))
    matches.push({...item,groupName:group.name});
  });
 });

 showSearchResults(matches,q,currentSection==="series");
}

function showSearchResults(matches,q,isSeries){
 currentViewItems=matches;
 renderedCount=0;

 const box=document.getElementById("channels");
 box.innerHTML="";
 const h=document.createElement("h2");
 h.textContent=`Search: "${q}" (${matches.length.toLocaleString()})`;
 box.appendChild(h);

 const list=document.createElement("div");
 list.id="resultList";
 box.appendChild(list);

 function add(){
  const end=Math.min(renderedCount+RENDER_BATCH,matches.length);
  const frag=document.createDocumentFragment();

  for(let i=renderedCount;i<end;i++){
   const item=matches[i];
   if(isSeries)frag.appendChild(createSeriesCard(item));
   else{
    const row=createChannelRow(item);
    row.querySelector(".small").insertAdjacentHTML("afterbegin",`Category: ${escapeHtml(item.groupName)}<br>`);
    frag.appendChild(row);
   }
  }
  list.appendChild(frag);
  renderedCount=end;
  updateRenderStatus();
 }

 add();
 box.onscroll=()=>{
  if(box.scrollTop+box.clientHeight>=box.scrollHeight-500)add();
 };
}

async function copyStream(url){
 if(!url){alert("No stream URL found.");return}
 try{
  await navigator.clipboard.writeText(url);
  document.getElementById("status").textContent="Stream URL copied.";
 }catch{prompt("Copy URL:",url)}
}

function downloadM3U(url,name){
 if(!url){alert("No stream URL found.");return}
 const safe=name.replace(/[\\/:*?"<>|]/g,"_");
 const blob=new Blob([`#EXTM3U\n#EXTINF:-1,${name}\n${url}\n`],{type:"audio/x-mpegurl"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download=safe+".m3u";
 document.body.appendChild(a);
 a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},100);
 document.getElementById("status").textContent=`Downloaded ${safe}.m3u`;
}

function clearSearch(){
 document.getElementById("search").value="";
 if(activeCategory!==null){
  const g=data[currentSection].groups[activeCategory];
  showItems(g.channels,g.name,currentSection==="series");
 }else document.getElementById("channels").innerHTML='<div class="notice">Select a category or search.</div>';
}

function escapeHtml(text){
 return String(text??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
</script>
</body>
</html>
