<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fast Xtream Viewer</title>
<style>
body { margin:0; font-family:Arial,sans-serif; background:#111; color:#eee; }
header { background:#1f1f1f; padding:12px; display:flex; gap:8px; flex-wrap:wrap; position:sticky; top:0; z-index:10; }
input, button { padding:9px; border-radius:6px; border:none; }
button { background:#2563eb; color:white; cursor:pointer; }
button:hover { background:#1d4ed8; }
button.section { background:#333; font-weight:bold; }
button.section.active { background:#2563eb; }
#status { padding:10px; background:#000; color:#bbb; font-size:14px; }
#layout { display:grid; grid-template-columns:320px 1fr; height:calc(100vh - 155px); }
#categories { overflow-y:auto; background:#181818; border-right:1px solid #333; padding:10px; }
#channels { overflow-y:auto; padding:10px; }
.category { padding:10px; background:#262626; margin-bottom:6px; border-radius:6px; cursor:pointer; }
.category:hover { background:#333; }
.category.active { background:#2563eb; }
.channel { padding:9px; background:#1d1d1d; border-bottom:1px solid #333; font-size:14px; }
.channel-row { display:flex; justify-content:space-between; gap:10px; align-items:center; }
.channel-actions { display:flex; gap:6px; flex-wrap:wrap; }
.small { font-size:12px; color:#aaa; word-break:break-all; }
.section-title { width:100%; color:#aaa; font-size:13px; margin-top:8px; }
.notice { color:#aaa; padding:12px; }
.series-card { padding:12px; background:#1d1d1d; border-bottom:1px solid #333; cursor:pointer; }
.series-card:hover { background:#292929; }
.series-logo { width:55px; height:75px; object-fit:cover; margin-right:12px; border-radius:4px; background:#333; }
.back { margin-bottom:12px; }
</style>
</head>

<body>
<header>
  <div class="section-title">Xtream Login</div>
  <input id="server" placeholder="Server URL e.g. http://example.com:8080" size="35">
  <input id="username" placeholder="Username">
  <input id="password" placeholder="Password" type="password">
  <button onclick="loadXtream()">Load Xtream</button>

  <div class="section-title">Content</div>
  <button id="liveBtn" class="section active" onclick="switchSection('live')">📺 Live TV</button>
  <button id="vodBtn" class="section" onclick="switchSection('vod')">🎬 Movies / VOD</button>
  <button id="seriesBtn" class="section" onclick="switchSection('series')">📺 Series</button>

  <div class="section-title">Search</div>
  <input id="search" placeholder="Search..." oninput="searchContent()" size="45">
  <button onclick="clearSearch()">Clear</button>
</header>

<div id="status">Enter Xtream details and click Load Xtream.</div>

<div id="layout">
  <div id="categories"></div>
  <div id="channels" class="notice">Select a content type and load Xtream.</div>
</div>

<script>
let data = {
  live: { categories: [], groups: [] },
  vod: { categories: [], groups: [] },
  series: { categories: [], groups: [] }
};

let currentSection = "live";
let activeCategory = null;
let currentSeries = null;

function cleanServer(url) {
  return url.trim().replace(/\/$/, "");
}

function getXtreamDetails() {
  return {
    server: cleanServer(document.getElementById("server").value),
    username: document.getElementById("username").value.trim(),
    password: document.getElementById("password").value.trim()
  };
}

async function xtream(action, extra = {}) {
  const d = getXtreamDetails();

  if (!d.server || !d.username || !d.password)
    throw new Error("Missing Xtream details");

  const params = new URLSearchParams({
    host: d.server,
    user: d.username,
    pass: d.password,
    action,
    ...extra
  });

  const res = await fetch(`/api/xtream?${params.toString()}`);
  const text = await res.text();

  if (!res.ok)
    throw new Error(text || "Xtream request failed");

  try {
    return JSON.parse(text);
  } catch {
    throw new Error("Xtream did not return JSON: " + text.slice(0, 200));
  }
}

async function loadXtream() {
  data = {
    live: { categories: [], groups: [] },
    vod: { categories: [], groups: [] },
    series: { categories: [], groups: [] }
  };

  activeCategory = null;
  currentSeries = null;

  document.getElementById("categories").innerHTML = "";
  document.getElementById("channels").innerHTML = "";
  document.getElementById("status").textContent = "Loading Xtream data...";

  try {
    await loadLive();
    await loadVod();
    await loadSeries();

    switchSection(currentSection);

    document.getElementById("status").textContent =
      `Loaded: ${countItems(data.live.groups)} live, ${countItems(data.vod.groups)} movies, ${countItems(data.series.groups)} series.`;

  } catch (err) {
    console.error(err);
    document.getElementById("status").textContent =
      "Error loading Xtream: " + (err.message || err);
  }
}

async function loadLive() {
  const categories = await xtream("get_live_categories");
  const streams = await xtream("get_live_streams");

  data.live.categories = categories || [];
  data.live.groups = groupItems(categories, streams, "live");
}

async function loadVod() {
  const categories = await xtream("get_vod_categories");
  const streams = await xtream("get_vod_streams");

  data.vod.categories = categories || [];
  data.vod.groups = groupItems(categories, streams, "vod");
}

async function loadSeries() {
  const categories = await xtream("get_series_categories");
  const series = await xtream("get_series");

  data.series.categories = categories || [];
  data.series.groups = groupItems(categories, series, "series");
}

function groupItems(categories, items, type) {
  const categoryMap = {};

  (categories || []).forEach(cat => {
    categoryMap[String(cat.category_id)] =
      cat.category_name || "Uncategorised";
  });

  const groups = {};

  (items || []).forEach(item => {
    const groupName =
      categoryMap[String(item.category_id)] || "Uncategorised";

    if (!groups[groupName]) groups[groupName] = [];

    groups[groupName].push({
      ...item,
      name: item.name || "Unnamed",
      streamId: item.stream_id || item.series_id || "",
      extension: item.container_extension || "mp4",
      logo: item.stream_icon || item.cover || ""
    });
  });

  return Object.keys(groups).sort().map(name => ({
    name,
    channels: groups[name].sort((a,b) =>
      String(a.name).localeCompare(String(b.name))
    )
  }));
}

function switchSection(section) {
  currentSection = section;
  activeCategory = null;
  currentSeries = null;
  document.getElementById("search").value = "";

  document.querySelectorAll(".section").forEach(b =>
    b.classList.remove("active")
  );

  document.getElementById(section + "Btn").classList.add("active");

  renderCategories();

  document.getElementById("channels").innerHTML =
    `<div class="notice">Select a ${section === "live" ? "category" : section === "vod" ? "movie category" : "series category"}.</div>`;
}

function renderCategories() {
  const categoriesDiv = document.getElementById("categories");
  categoriesDiv.innerHTML = "";

  const groups = data[currentSection].groups;

  groups.forEach((group, index) => {
    const div = document.createElement("div");
    div.className = "category";
    div.textContent = `${group.name} (${group.channels.length})`;

    div.onclick = () => {
      activeCategory = index;
      currentSeries = null;
      document.getElementById("search").value = "";
      renderCategories();

      if (currentSection === "series")
        renderSeries(group.channels, group.name);
      else
        renderChannels(group.channels, group.name);
    };

    if (activeCategory === index)
      div.classList.add("active");

    categoriesDiv.appendChild(div);
  });
}

function renderChannels(channels, title = "Channels") {
  const channelsDiv = document.getElementById("channels");
  channelsDiv.innerHTML = "";

  const heading = document.createElement("h2");
  heading.textContent = `${title} (${channels.length})`;
  channelsDiv.appendChild(heading);

  const fragment = document.createDocumentFragment();

  channels.forEach(ch => {
    const streamUrl = getStreamUrl(ch);

    const row = document.createElement("div");
    row.className = "channel";

    row.innerHTML = `
      <div class="channel-row">
        <div style="flex:1;">
          <strong>${escapeHtml(ch.name)}</strong>
          <div class="small">
            ${ch.streamId ? "ID: " + escapeHtml(ch.streamId) : ""}
            ${ch.extension ? "<br>Format: ." + escapeHtml(ch.extension) : ""}
          </div>
        </div>
        <div class="channel-actions">
          <button onclick="copyStream('${encodeURIComponent(streamUrl)}')">Copy URL</button>
          <button onclick="downloadM3U('${encodeURIComponent(streamUrl)}','${encodeURIComponent(ch.name)}')">Download .M3U</button>
        </div>
      </div>
    `;

    fragment.appendChild(row);
  });

  channelsDiv.appendChild(fragment);
}

function renderSeries(series, title) {
  const channelsDiv = document.getElementById("channels");
  channelsDiv.innerHTML = "";

  const heading = document.createElement("h2");
  heading.textContent = `${title} (${series.length})`;
  channelsDiv.appendChild(heading);

  const fragment = document.createDocumentFragment();

  series.forEach(item => {
    const row = document.createElement("div");
    row.className = "series-card";

    const cover = item.cover || item.logo || "";

    row.innerHTML = `
      <div style="display:flex;align-items:center;">
        ${cover ? `<img class="series-logo" src="${escapeHtml(cover)}" onerror="this.style.display='none'">` : ""}
        <div>
          <strong>${escapeHtml(item.name)}</strong>
          <div class="small">Series ID: ${escapeHtml(item.series_id || item.streamId)}</div>
        </div>
      </div>
    `;

    row.onclick = () => openSeries(item);
    fragment.appendChild(row);
  });

  channelsDiv.appendChild(fragment);
}

async function openSeries(series) {
  currentSeries = series;
  const channelsDiv = document.getElementById("channels");

  channelsDiv.innerHTML = `<div class="notice">Loading ${escapeHtml(series.name)}...</div>`;

  try {
    const result = await xtream("get_series_info", {
      series_id: series.series_id || series.streamId
    });

    renderEpisodes(series, result);
  } catch (err) {
    channelsDiv.innerHTML =
      `<div class="notice">Error loading series: ${escapeHtml(err.message)}</div>`;
  }
}

function renderEpisodes(series, result) {
  const channelsDiv = document.getElementById("channels");
  channelsDiv.innerHTML = "";

  const back = document.createElement("button");
  back.className = "back";
  back.textContent = "← Back to Series";
  back.onclick = () => {
    if (activeCategory !== null)
      renderSeries(data.series.groups[activeCategory].channels, data.series.groups[activeCategory].name);
  };
  channelsDiv.appendChild(back);

  const heading = document.createElement("h2");
  heading.textContent = series.name;
  channelsDiv.appendChild(heading);

  const episodes = result.episodes || {};

  Object.keys(episodes).sort((a,b) =>
    Number(a) - Number(b)
  ).forEach(season => {
    const seasonTitle = document.createElement("h3");
    seasonTitle.textContent = `Season ${season}`;
    channelsDiv.appendChild(seasonTitle);

    episodes[season].forEach(ep => {
      const row = document.createElement("div");
      row.className = "channel";

      const streamId = ep.id || ep.episode_num || "";
      const extension = ep.container_extension || "mp4";
      const url = getSeriesUrl(streamId, extension);

      row.innerHTML = `
        <div class="channel-row">
          <div style="flex:1;">
            <strong>
              S${String(season).padStart(2,"0")}
              E${String(ep.episode_num || "").padStart(2,"0")}
              - ${escapeHtml(ep.title || "Episode")}
            </strong>
            <div class="small">
              ${ep.info?.plot ? escapeHtml(ep.info.plot) + "<br>" : ""}
              Format: .${escapeHtml(extension)}
            </div>
          </div>
          <div class="channel-actions">
            <button onclick="copyStream('${encodeURIComponent(url)}')">Copy URL</button>
            <button onclick="downloadM3U('${encodeURIComponent(url)}','${encodeURIComponent((series.name || "Series") + " - S" + season + "E" + ep.episode_num)}')">Download .M3U</button>
          </div>
        </div>
      `;

      channelsDiv.appendChild(row);
    });
  });
}

function getStreamUrl(ch) {
  const d = getXtreamDetails();

  if (!ch.streamId) return "";

  const ext = ch.extension || "mp4";

  if (currentSection === "live")
    return `${d.server}/live/${encodeURIComponent(d.username)}/${encodeURIComponent(d.password)}/${ch.streamId}.${ext}`;

  if (currentSection === "vod")
    return `${d.server}/movie/${encodeURIComponent(d.username)}/${encodeURIComponent(d.password)}/${ch.streamId}.${ext}`;

  return "";
}

function getSeriesUrl(streamId, extension) {
  const d = getXtreamDetails();

  if (!streamId) return "";

  return `${d.server}/series/${encodeURIComponent(d.username)}/${encodeURIComponent(d.password)}/${streamId}.${extension || "mp4"}`;
}

function searchContent() {
  const q = document.getElementById("search").value.toLowerCase().trim();

  if (!q) {
    if (activeCategory !== null) {
      const group = data[currentSection].groups[activeCategory];
      if (currentSection === "series")
        renderSeries(group.channels, group.name);
      else
        renderChannels(group.channels, group.name);
    } else {
      document.getElementById("channels").innerHTML =
        '<div class="notice">Select a category or search.</div>';
    }
    return;
  }

  activeCategory = null;
  renderCategories();

  const matches = [];

  data[currentSection].groups.forEach(group => {
    group.channels.forEach(item => {
      if (String(item.name).toLowerCase().includes(q)) {
        matches.push({...item, groupName: group.name});
      }
    });
  });

  if (currentSection === "series")
    renderSeriesSearchResults(matches, q);
  else
    renderSearchResults(matches, q);
}

function renderSearchResults(matches, q) {
  const channelsDiv = document.getElementById("channels");
  channelsDiv.innerHTML = "";

  const heading = document.createElement("h2");
  heading.textContent = `Search: "${q}" (${matches.length})`;
  channelsDiv.appendChild(heading);

  matches.forEach(ch => {
    const streamUrl = getStreamUrl(ch);

    const row = document.createElement("div");
    row.className = "channel";

    row.innerHTML = `
      <div class="channel-row">
        <div style="flex:1;">
          <strong>${escapeHtml(ch.name)}</strong>
          <div class="small">
            Category: ${escapeHtml(ch.groupName)}<br>
            ID: ${escapeHtml(ch.streamId || "")}
          </div>
        </div>
        <div class="channel-actions">
          <button onclick="copyStream('${encodeURIComponent(streamUrl)}')">Copy URL</button>
          <button onclick="downloadM3U('${encodeURIComponent(streamUrl)}','${encodeURIComponent(ch.name)}')">Download .M3U</button>
        </div>
      </div>
    `;

    channelsDiv.appendChild(row);
  });
}

function renderSeriesSearchResults(matches, q) {
  const channelsDiv = document.getElementById("channels");
  channelsDiv.innerHTML = "";

  const heading = document.createElement("h2");
  heading.textContent = `Search: "${q}" (${matches.length})`;
  channelsDiv.appendChild(heading);

  matches.forEach(item => {
    const row = document.createElement("div");
    row.className = "series-card";

    row.innerHTML = `
      <strong>${escapeHtml(item.name)}</strong>
      <div class="small">Category: ${escapeHtml(item.groupName)}</div>
    `;

    row.onclick = () => openSeries(item);
    channelsDiv.appendChild(row);
  });
}

async function copyStream(url) {
  url = decodeURIComponent(url);

  if (!url) {
    alert("No stream URL found.");
    return;
  }

  try {
    await navigator.clipboard.writeText(url);
    document.getElementById("status").textContent = "Stream URL copied.";
  } catch {
    prompt("Copy URL:", url);
  }
}

function downloadM3U(url, name) {
  url = decodeURIComponent(url);
  name = decodeURIComponent(name);

  if (!url) {
    alert("No stream URL found.");
    return;
  }

  const safeName = name.replace(/[\\/:*?"<>|]/g, "_");

  const m3uContent = `#EXTM3U
#EXTINF:-1,${name}
${url}
`;

  const blob = new Blob([m3uContent], {type:"audio/x-mpegurl"});
  const a = document.createElement("a");

  a.href = URL.createObjectURL(blob);
  a.download = safeName + ".m3u";

  document.body.appendChild(a);
  a.click();

  URL.revokeObjectURL(a.href);
  a.remove();

  document.getElementById("status").textContent =
    `Downloaded ${safeName}.m3u`;
}

function clearSearch() {
  document.getElementById("search").value = "";

  if (activeCategory !== null) {
    const group = data[currentSection].groups[activeCategory];

    if (currentSection === "series")
      renderSeries(group.channels, group.name);
    else
      renderChannels(group.channels, group.name);
  } else {
    document.getElementById("channels").innerHTML =
      '<div class="notice">Select a category or search.</div>';
  }
}

function countItems(groups) {
  return groups.reduce((total, group) =>
    total + group.channels.length, 0);
}

function escapeHtml(text) {
  return String(text ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[m]));
}
</script>
</body>
</html>
